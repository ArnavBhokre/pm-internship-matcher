<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | PM Internship Matcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="center-page">
    <div class="card auth-card">
      <div class="headline">
        <div class="logo-badge">🔑</div>
        <h1>Reset your password</h1>
        <p id="stepHint">Enter your email to receive a verification code</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="requestForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Send OTP</button>
      </form>

      <form id="resetForm" style="display:none;">
        <div class="field">
          <label for="otpCode">6-digit OTP</label>
          <input type="text" id="otpCode" maxlength="6" placeholder="123456" required>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" minlength="6" placeholder="At least 6 characters" required>
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </form>

      <p class="auth-footer"><a href="index.html">Back to Sign In</a></p>
    </div>
  </div>
  <footer class="site-footer">PM Internship Scheme &mdash; AI Internship Recommendation Engine (Demo)</footer>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const alertBox = document.getElementById("alertBox");
  function showAlert(msg, type = "error") {
    alertBox.className = "alert alert-" + type + " show";
    alertBox.textContent = msg;
  }

  let currentEmail = "";

  document.getElementById("requestForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    currentEmail = document.getElementById("email").value.trim();
    try {
      await Api.forgotPassword({ email: currentEmail, purpose: "PASSWORD_RESET" });
      document.getElementById("requestForm").style.display = "none";
      document.getElementById("resetForm").style.display = "block";
      document.getElementById("stepHint").textContent = "Enter the OTP sent to " + currentEmail + " and your new password";
      showAlert("OTP sent successfully.", "success");
    } catch (err) { showAlert(err.message); }
  });

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const res = await Api.resetPassword(currentEmail, document.getElementById("otpCode").value.trim(), document.getElementById("newPassword").value);
      TokenStore.saveAuth(res.data);
      window.location.href = res.data.profileComplete ? "dashboard.html" : "profile.html";
    } catch (err) { showAlert(err.message); }
  });
</script>
</body>
</html>
