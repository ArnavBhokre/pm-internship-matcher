<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PM Internship Matcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="center-page">
    <div class="card auth-card">
      <div class="headline">
        <div class="logo-badge">PM</div>
        <h1>Welcome back</h1>
        <p>Sign in to see your AI-matched internships</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <div style="text-align:right; margin-bottom:16px;">
          <a href="forgot-password.html" style="font-size:12.5px; color:var(--saffron-dark); font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>

      <div class="divider">OR</div>

      <a href="#" id="googleLoginBtn" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.7 2.5-7.7 2.5-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.6C41.4 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </a>

      <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>
  <footer class="site-footer">PM Internship Scheme &mdash; AI Internship Recommendation Engine (Demo)</footer>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("googleLoginBtn").addEventListener("click", (e) => {
    e.preventDefault();
    window.location.href = GOOGLE_LOGIN_URL;
  });

  function handleOAuthRedirectParams() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("token")) {
      TokenStore.token = params.get("token");
      TokenStore.refreshToken = params.get("refreshToken");
      TokenStore.studentId = params.get("studentId");
      const profileComplete = params.get("profileComplete") === "true";
      window.location.href = profileComplete ? "dashboard.html" : "profile.html";
    }
  }
  handleOAuthRedirectParams();

  if (TokenStore.isLoggedIn()) {
    window.location.href = "dashboard.html";
  }

  const form = document.getElementById("loginForm");
  const alertBox = document.getElementById("alertBox");
  const loginBtn = document.getElementById("loginBtn");

  function showAlert(msg, type = "error") {
    alertBox.className = "alert alert-" + type + " show";
    alertBox.textContent = msg;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.remove("show");
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    try {
      const res = await Api.login({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });
      TokenStore.saveAuth(res.data);
      window.location.href = res.data.profileComplete ? "dashboard.html" : "profile.html";
    } catch (err) {
      showAlert(err.message);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
