spring.application.name=pm-internship-matcher
spring.config.import=optional:application-local.properties

# ================= SERVER =================
server.port=8080
server.servlet.context-path=/

# ================= MYSQL DATABASE =================
# Database name: defaultdb  (create it once with: CREATE DATABASE internship;)
spring.datasource.url=jdbc:mysql://localhost:3306/internship
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ================= JWT =================
# Change this secret before going to production (min 256-bit / 32+ chars)
app.jwt.secret=ChangeThisSuperSecretKeyForPMInternshipMatcher2026MakeItLongAndRandom
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ================= OTP =================
app.otp.expiry-minutes=5
app.otp.length=6
# When true, OTP is also printed to the backend console/log (use for local testing without SMTP)
app.otp.log-to-console=true

# ================= MAIL (used to send OTP emails) =================
# Fill these in with your own SMTP provider (e.g. Gmail SMTP + App Password) to send real emails.
# If left blank, the app still works locally because app.otp.log-to-console=true prints the OTP.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:arnavbhokre2810@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=arnavbhokre2810@gmail.com
app.mail.enabled=true
app.otp.log-to-console=true

# ================= GOOGLE OAUTH2 LOGIN =================
# Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to register there: http://localhost:8080/login/oauth2/code/google
# Google OAuth2 — disabled for local dev (uncomment and set real values to enable)
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# After successful Google login, user is redirected here with a JWT token as query param
app.oauth2.redirect-uri=http://localhost:5500/dashboard.html

# ================= CORS (frontend origin) =================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:5501,http://192.168.29.107:5500,http://localhost:5173,null

# ================= LOGGING =================
logging.level.org.springframework.security=INFO
logging.level.com.internship.matcher=DEBUG
